project: "ALFWORLD_TCOD"
name: "alfworld_guided_opd_qwen3_20260716202233"
checkpoint_root_dir: {CHECKPOINT_ROOT}
continue_from_checkpoint: true

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  policy_loss_fn: mix
  policy_loss_fn_args:
    mu: 0.5
    clip_range: 0.2
    loss_agg_mode: token-mean
  optimizer:
    lr: 1e-6

model:
  model_path: <student-model>
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 1
  gpu_per_node: 8

buffer:
  total_steps: 250
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: {TCOD_DIR}/configs/alfworld/alfworld_data/train.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
        beta_start: 1.0
        beta_end: 0.0
        curriculum_ratio: 0.8
        total_steps: 250
    eval_tasksets:
      - name: alfworld_eval
        storage_type: file
        path: {TCOD_DIR}/configs/alfworld/alfworld_data/test.jsonl
        split: test
        total_steps: 10
        task_selector:
          selector_type: random
          seed: 42
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          logprobs: 0
    default_workflow_type: 'guided_opd_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_guided_opd_buffer
      storage_type: queue
      path: 'sqlite:////tmp/tcod_buffer.db'
      max_read_timeout: 7200

explorer:
  eval_interval: 5
  runner_per_model: 16
  max_timeout: 3600
  rollout_model:
    engine_num: 2
    tensor_parallel_size: 2
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.82
    enable_chunked_prefill: false
  auxiliary_models:
    - model_path: <teacher-model>
      engine_num: 1
      tensor_parallel_size: 2
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/alfworld_tmp
    RAY_TMPDIR: /dev/shm/ray_tmp

synchronizer:
  sync_method: 'nccl'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  total_steps: 250
  save_interval: 10
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 2

monitor:
  monitor_type: wandb
