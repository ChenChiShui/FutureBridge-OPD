project: "FutureBridge-OPD"
name: "alfworld_no_future_validation_ablation_rl_teacher"
checkpoint_root_dir: outputs/checkpoints
continue_from_checkpoint: false

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  optimizer:
    lr: 1e-6

model:
  model_path: models/Qwen3-4B
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 1
  gpu_per_node: 8

buffer:
  total_steps: 200
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: data/alfworld/train_expert.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 30
        total_steps: 200
        checkpoint_strategy: linear
        checkpoint_steps: 5
        bridge_position_top_k: 1
        bridge_max_per_ep: 1
        continuation_steps: 3
        bridge_failed_episodes_only: false
        bridge_require_full_continuation: true
    eval_tasksets:
      - name: alfworld_eval
        storage_type: file
        path: data/alfworld/test_unseen.jsonl
        split: test
        total_steps: 134
        task_selector:
          selector_type: sequential
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          max_tokens: 512
          logprobs: 0
    default_workflow_type: 'trinity.common.workflows.envs.TCOD.alfworld.futurebridge_workflow.FutureBridgeNoFutureValidationAlfworldWorkflow'
  trainer_input:
    experience_buffer:
      name: alfworld_no_future_validation_buffer
      storage_type: queue
      path: 'sqlite:///outputs/buffers/alfworld_no_future_validation_buffer.db'

explorer:
  eval_interval: 9999
  eval_on_startup: false
  runner_per_model: 6
  max_timeout: 3600
  rollout_model:
    engine_num: 2
    tensor_parallel_size: 2
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    gpu_memory_utilization: 0.82
    enable_chunked_prefill: false
    enable_thinking: false
  auxiliary_models:
    - model_path: models/Qwen3-8B-RL/alfworld
      engine_num: 1
      tensor_parallel_size: 2
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      max_model_len: 20480
      max_prompt_tokens: 10240
      max_response_tokens: 512
      enable_thinking: false
  env_vars:
    TMPDIR: outputs/tmp
    RAY_TMPDIR: outputs/ray_tmp

synchronizer:
  sync_method: 'nccl'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  total_steps: 200
  save_interval: 10
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 2

monitor:
  monitor_type: wandb
