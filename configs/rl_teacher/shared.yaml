base_model: Qwen3-8B
algorithm: GiGPO
optimizer:
  name: AdamW
  learning_rate: 1e-6
  weight_decay: 0.01
discount_factor: 0.95
rollout_group_size: 8
invalid_action_penalty: 0.1
max_prompt_tokens: 4096
max_response_tokens: 512
enable_thinking: false
training:
  temperature: 1.0
  sampling: true
validation:
  temperature: 0.4
  sampling: true
